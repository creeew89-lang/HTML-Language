<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frogey Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Frogey Dashboard</span>
            <span class="badge bg-primary" id="count">Cards:0</span>
        </div>
    </nav>
    <div class="container mt-4">
        <button class="btn btn-success mb-3" onclick="flipAxis()">Flip Axis</button>
        <div id="cardRow" class="d-flex flex-wrap gap-3 justify-content-center">
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const titles = ['Red Frog', 'Green Frog', 'Blue Frog', 'Yellow Frog', 'Purple Frog'];
        const colors = ['danger', 'success', 'primary', 'warning', 'info'];
        const container = document.getElementById('cardRow');
        const countBadge = document.getElementById('count');
        titles.forEach((t, i) => {
            container.insertAdjacentHTML('beforeend', `
      <div class="card text-white bg-${colors[i]} mb-3" style="width:14rem;">
        <div class="card-body">
          <h5 class="card-title">${t}</h5>
          <p class="card-text">Demo text.</p>
        </div>
      </div>`);
        });
        countBadge.textContent = `Cards: ${titles.length}`;

        function flipAxis() {
            const row = document.getElementById('cardRow');
            row.classList.toggle('flex-column');
            row.classList.toggle('align-items-center');
        }
    </script>
</body>

</html>
