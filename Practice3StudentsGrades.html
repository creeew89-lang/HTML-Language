<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table & Form Practice</title>
    <style>
        #grades-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-family: Arial, sans-serif;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        #grades-table thead {
            background-color: #4CAF50;
            color: white;
        }

        #grades-table th,
        #grades-table td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }

        #grades-table tbody tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        #grades-table tbody tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }

        #student-form {
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
            border: 1px solid #ddd;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            font-family: Arial, sans-serif;
        }

        #student-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        button[type="submit"],
        button[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: white;
        }

        button[type="reset"] {
            background-color: #f44336;
            color: white;
        }

        button[type="reset"]:hover {
            background-color: #da190b;
        }

        @media screen and (max-width: 600px) {

            #grades-table th,
            #grades-table td {
                padding: 8px 10px;
                font-size: 14px;
            }

            #student-form {
                padding: 15px;
            }

            .form-actions {
                flex-direction: column;
                gap: 10px;
            }

            button[type="submit"],
            button[type="reset"] {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h2>Practice 3: Student Grades Table</h2>
    <table id="grades-table">
        <thead>
            <tr>
                <th>Student name</th>
                <th>Subject</th>
                <th>Grade</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>AL - Muiayed AL - Ansari</td>
                <td>English</td>
                <td>92%</td>
                <td>Pass</td>
            </tr>
            <tr>
                <td>Ali AL - Buloshi</td>
                <td>Science</td>
                <td>100%</td>
                <td>Pass</td>
            </tr>
            <tr>
                <td>Deema</td>
                <td>Physics</td>
                <td>100%</td>
                <td>Pass</td>
            </tr>
            <tr>
                <td>Barker</td>
                <td>Sport</td>
                <td>90%</td>
                <td>Pass</td>
            </tr>
            <tr>
                <td>Dummy</td>
                <td>Science</td>
                <td>49%</td>
                <td>Fail</td>
            </tr>
        </tbody>
    </table>

    <h2>Student Registration Form</h2>
    <form id="student-form">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" required>
        </div>
        <div class="form-group">
            <label>Grade Level</label>
            <select required>
                <option value="">Select Grade</option>
                <option>9th Grade</option>
                <option>10th Grade</option>
                <option>11th Grade</option>
                <option>12th Grade</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit">Register</button>
            <button type="reset">Clear</button>
        </div>
    </form>
</body>

</html>
